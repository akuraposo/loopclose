<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoopClose — live Kane loop (motion stage)</title>
<style>
  :root{--bg:#070910;--panel:#10141e;--line:#242b3d;--txt:#e8ecf8;--mut:#9aa5bd;--acc:#8b9dff;--ok:#4ade80;--bad:#fb7185;--cy:#5eead4}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif;overflow:hidden}
  #ambient{position:fixed;inset:-30%;pointer-events:none;z-index:0}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.16;animation:float 14s ease-in-out infinite}
  .orb.a{width:520px;height:520px;background:#5b49c8;top:-80px;left:-60px}
  .orb.b{width:420px;height:420px;background:#1e6f8c;bottom:-90px;right:-40px;animation-delay:-5s}
  .orb.c{width:300px;height:300px;background:#8a3d61;top:40%;left:55%;animation-delay:-9s}
  @keyframes float{50%{transform:translate(70px,-60px) scale(1.12)}100%{transform:translate(0,0)}}
  .stage{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:16px 22px 14px;gap:12px}
  header{display:flex;align-items:center;justify-content:space-between;gap:20px;height:34px}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand b{font-size:25px;letter-spacing:-.8px}
  .brand b span{color:var(--acc)}
  .brand small{color:var(--mut);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .live{display:flex;align-items:center;gap:8px;color:var(--ok);font:12px/1 ui-monospace,Consolas,monospace;letter-spacing:.1em}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px var(--ok);animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25;box-shadow:none}}

  /* animated closed-loop pipeline */
  .pipe{height:46px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;background:#0b0f18aa;padding:0 16px;overflow:hidden;position:relative}
  .pipe:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#8b9dff12 50%,transparent 70%);transform:translateX(-100%);animation:sheen 5s linear infinite}
  @keyframes sheen{to{transform:translateX(100%)}}
  .node{display:flex;align-items:center;gap:7px;color:#7d88a3;font:11px/1 ui-monospace,Consolas,monospace;letter-spacing:.06em;white-space:nowrap;transition:color .35s,text-shadow .35s}
  .node i{width:9px;height:9px;border-radius:50%;background:#394158;transition:background .35s,box-shadow .35s}
  .node.on{color:#e2e9ff;text-shadow:0 0 14px #8b9dff88}
  .node.on i{background:var(--acc);box-shadow:0 0 13px var(--acc)}
  .node.done{color:var(--ok)}
  .node.done i{background:var(--ok);box-shadow:0 0 11px var(--ok)}
  .wire{position:relative;flex:1;height:1px;background:#2b3348;min-width:22px}
  .wire:before{content:"";position:absolute;top:-2px;width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:travel 2.2s linear infinite}
  @keyframes travel{from{left:0;opacity:0}15%{opacity:1}85%{opacity:1}to{left:100%;opacity:0}}
  .loopmark{font:11px/1 ui-monospace,Consolas,monospace;color:#606b85;white-space:nowrap}

  .grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.75fr) minmax(330px,.9fr);gap:14px}
  .frame,.term{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 70px #0007;position:relative}
  .frame{animation:breathe 7s ease-in-out infinite}
  @keyframes breathe{50%{border-color:#39446b}}
  .chrome{height:42px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#0b0e15;border-bottom:1px solid var(--line)}
  .lights{display:flex;gap:6px}.lights i{width:10px;height:10px;border-radius:50%;background:#3b4358}.lights i:nth-child(1){background:#fb7185}.lights i:nth-child(2){background:#fbbf24}.lights i:nth-child(3){background:#4ade80}
  .url{flex:1;max-width:640px;margin:0 auto;background:#070910;border:1px solid #1f2637;border-radius:7px;padding:6px 12px;color:#b9c4dd;font:11px/1 ui-monospace,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .viewport{width:100%;height:calc(100% - 42px);overflow:hidden;position:relative}
  iframe{width:100%;height:100%;border:0;background:#0b0d12;display:block;transform-origin:top left;animation:kenburns 22s ease-in-out infinite alternate}
  @keyframes kenburns{from{transform:scale(1.005) translate(0,0)}to{transform:scale(1.03) translate(-6px,-4px)}}
  .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,#ffffff04 4px);mix-blend-mode:screen;opacity:.32}
  .sweep{position:absolute;left:0;right:0;height:70px;pointer-events:none;background:linear-gradient(to bottom,transparent,#8b9dff10,transparent);animation:sweep 6s linear infinite;opacity:.6}
  @keyframes sweep{from{top:-80px}to{top:100%}}
  .flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,#8b9dff35,transparent 65%);opacity:0}
  .flash.go{animation:flash .8s ease-out}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}

  .term-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#0b0e15;border-bottom:1px solid var(--line);font:12px/1 ui-monospace,Consolas,monospace;color:#cbd5f5;letter-spacing:.06em}
  .term-head .st{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:10px}
  .ring{width:9px;height:9px;border-radius:50%;border:2px solid #394158;border-top-color:var(--acc);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .meter{height:3px;background:#1b2130;overflow:hidden}
  .meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--cy));box-shadow:0 0 10px var(--acc);transition:width .35s}
  pre{margin:0;padding:14px;height:calc(100% - 45px);overflow:auto;white-space:pre-wrap;word-break:break-word;color:#cfe0ff;font:11.5px/1.62 ui-monospace,Consolas,monospace;text-shadow:0 0 12px #6d8dff25}
  pre::-webkit-scrollbar{width:6px}pre::-webkit-scrollbar-thumb{background:#2b344a;border-radius:9px}
  .cmd{color:#c4b5fd}.key{color:var(--cy)}.val{color:var(--ok)}.warn{color:var(--bad)}
  .caret{display:inline-block;width:7px;height:13px;background:var(--acc);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}

  .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;height:50px}
  .step{position:relative;border:1px solid var(--line);border-radius:10px;background:#0c1018;display:flex;align-items:center;padding:0 12px;color:#68738d;font:11px/1.3 ui-monospace,Consolas,monospace;overflow:hidden;transition:color .4s,border-color .4s,transform .4s}
  .step:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#8b9dff30,transparent);transform:translateX(-100%);transition:transform .8s}
  .step.on{color:#dbe4ff;border-color:var(--acc);transform:translateY(-2px);box-shadow:0 0 18px #8b9dff22}
  .step.on:before{transform:translateX(0);animation:stepSheen 2s ease-in-out infinite alternate}
  @keyframes stepSheen{to{transform:translateX(35%)}}
  .step.done{color:var(--ok);border-color:#2d5b43}
  .step b{margin-right:8px;color:inherit;opacity:.6}
  .charge{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:9px;opacity:.75}
</style>
</head>
<body>
<div id="ambient"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
<div class="stage">
  <header>
    <div class="brand"><b>Loop<span>Close</span></b><small>agent × kane cli · live loop</small></div>
    <div class="live"><i class="dot"></i> RECORDING REAL BROWSER + REAL KANE OUTPUT</div>
  </header>
  <div class="pipe" id="pipe">
    <div class="node" data-n="1"><i></i>AGENT</div><div class="wire"></div>
    <div class="node" data-n="2"><i></i>KANE CLI</div><div class="wire"></div>
    <div class="node" data-n="3"><i></i>VERDICT</div><div class="wire"></div>
    <div class="node" data-n="4"><i></i>FIX</div><div class="wire"></div>
    <div class="node" data-n="5"><i></i>GATE</div>
    <div class="loopmark">↻ repeat until proved</div>
  </div>
  <div class="grid">
    <section class="frame">
      <div class="chrome"><div class="lights"><i></i><i></i><i></i></div><div class="url" id="url">http://127.0.0.1:8137/index.html</div></div>
      <div class="viewport"><iframe id="app" src="index.html"></iframe><div class="scan"></div><div class="sweep"></div><div class="flash" id="flash"></div></div>
    </section>
    <section class="term">
      <div class="term-head"><span>KANE CLI · NDJSON STREAM</span><span class="st"><i class="ring" id="ring"></i><span id="term-state">idle</span></span></div>
      <div class="meter"><i id="meter"></i></div>
      <pre id="log"><span class="caret"></span></pre>
    </section>
  </div>
  <footer class="steps" id="steps">
    <div class="step on"><b>01</b> gate closed</div>
    <div class="step"><b>02</b> kane catches bug</div>
    <div class="step"><b>03</b> agent patches</div>
    <div class="step"><b>04</b> kane verifies fix</div>
    <div class="step"><b>05</b> proof + ship</div>
  </footer>
</div>
<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

window.Stage = {
  step(n){
    const items=[...document.querySelectorAll('.step')];
    items.forEach((el,i)=>{el.classList.toggle('on',i===n-1);el.classList.toggle('done',i<n-1)});
    if(n===1) items.forEach(el=>el.classList.remove('done'));
    const nodes=[...document.querySelectorAll('.node')];
    nodes.forEach((el,i)=>{el.classList.toggle('on',i===n-1);el.classList.toggle('done',i<n-1)});
    const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  },
  url(u){$('url').textContent=u;},
  state(s){$('term-state').textContent=s;$('ring').style.animationPlayState = s==='idle' ? 'paused' : 'running';},
  progress(p){$('meter').style.width=p+'%';},
  charge(n,s){const el=document.querySelectorAll('.step')[n-1];let c=el.querySelector('.charge');if(!c){c=document.createElement('span');c.className='charge';el.appendChild(c)}c.textContent=s;},
  clear(){$('log').textContent='';$('meter').style.width='0%';},
  async log(lines,speed=5){
    const pre=$('log');
    for(const line of lines){
      const span=document.createElement('span');
      if(line.startsWith('$ ')) span.className='cmd';
      else if(/BUG CONFIRMED|failed verdict opened|CLOSED/.test(line)) span.className='warn';
      else if(line.trim().startsWith('{')) span.className='key';
      pre.appendChild(span);
      const shown=line;
      for(let i=0;i<shown.length;i++){
        span.textContent=shown.slice(0,i+1);
        await sleep(speed);
        pre.scrollTop=pre.scrollHeight;
      }
      pre.appendChild(document.createTextNode('\n'));
      await sleep(80);
    }
    const caret=document.createElement('span');caret.className='caret';pre.appendChild(caret);
    pre.scrollTop=pre.scrollHeight;
  }
};
Stage.step(1);
</script>
</body>
</html>
